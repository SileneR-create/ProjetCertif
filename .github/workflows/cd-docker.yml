name: CD Docker Build & Deploy Local

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── ÉTAPE 1 : Build & Push du BACKEND ──
      - name: Build and push FastAPI Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile  
          push: true
          tags: silener/projetcertif-backend:latest 

      # ── ÉTAPE 2 : Build & Push du FRONTEND ──
      - name: Build and push Streamlit Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile 
          push: true
          tags: silener/projetcertif-frontend:latest

      # ── ÉTAPE 3 : LE DÉPLOIEMENT AUTOMATIQUE LOCAL ──
      - name: Deploy Local Containers
        run: |
          docker compose pull backend frontend
          docker compose up -d