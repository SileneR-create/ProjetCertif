name: CD Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── ÉTAPE 1 : Build & Push du BACKEND (FastAPI) ──
      - name: Build and push FastAPI Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile  
          push: true
          tags: SileneR-create/projetcertif-backend:latest 

      # ── ÉTAPE 2 : Build & Push du FRONTEND (Streamlit) ──
      - name: Build and push Streamlit Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile 
          push: true
          tags: SileneR-create/projetcertif-frontend:latest