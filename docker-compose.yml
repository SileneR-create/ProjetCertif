version: "3.9"

services:
  # ── BASE DE DONNÉES ──
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bdd_projet_certif
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travelmatch_network

  # ── BACKEND (FastAPI) ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile  
    container_name: fastapi_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db  
    ports:
      - "8001:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bdd_projet_certif
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - travelmatch_network

  # ── FRONTEND (Streamlit) ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile  
    container_name: streamlit_app
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    networks:
      - travelmatch_network

  # ── PGADMIN (Visualiser les données) ──
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}  # ← Correction ici (suppression du 'a' parasite)
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - travelmatch_network

  # ── PROMETHEUS (Collecteur de données de l'IA) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - travelmatch_network

  # ── GRAFANA (Tableaux de bord visuels) ──
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - travelmatch_network

  # ── MLFLOW (Tracking d'expériences IA) ──
  mlflow:
      build:
        context: .
        dockerfile: Dockerfile.mlflow  # ← Utilise le nouveau fichier pour inclure psycopg2
      container_name: travelmatch_mlflow
      restart: always
      ports:
        - "5000:5000"
      volumes:
        - mlflow_data:/mlflow
        - ./mlartifacts:/mlartifacts
      depends_on:
        - db
      command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://user:password@db:5432/bdd_projet_certif --default-artifact-root /mlartifacts      
      networks:
        - travelmatch_network

volumes:
  postgres_data:
  mlflow_data:

networks:
  travelmatch_network:
    driver: bridge