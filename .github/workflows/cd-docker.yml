name: CD Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
  
    permissions:
        contents: read
        packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── ÉTAPE 1 : Build & Push du BACKEND (FastAPI) ──
      - name: Build and push FastAPI Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile  
          push: true
          tags: silener/projetcertif-backend:latest 

      # ── ÉTAPE 2 : Build & Push du FRONTEND (Streamlit) ──
      - name: Build and push Streamlit Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile 
          push: true
          tags: silener/projetcertif-frontend:latest

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/mon_projet_travelmatch
            git pull origin main
            docker compose pull backend frontend  # Télécharge tes nouvelles images IA
            docker compose up -d                  # Relance tout, y compris Prometheus et Grafana